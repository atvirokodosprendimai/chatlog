#
# On a tag v*: tarballs for darwin/arm64, darwin/amd64, linux/amd64, linux/arm64 with SHA256SUMS on the GitHub release,
# the container image on ghcr.io, and Formula/chatlog.rb in this repository regenerated for the release. The repository
# is its own Homebrew tap (brew tap atvirokodosprendimai/chatlog https://github.com/atvirokodosprendimai/chatlog), so the
# only credential is the workflow's own GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image on ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build the artifacts
        run: sh scripts/release-build.sh "$GITHUB_REF_NAME" dist
      - name: GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/atvirokodosprendimai/chatlog
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # the binaries are cross-built above (no CGO), so the image needs no emulation for arm64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
  formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # one commit of Formula/chatlog.rb to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the tags, to tell whether this one is the latest
      - name: Formula/chatlog.rb for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then echo "$GITHUB_REF_NAME is not the latest tag ($latest): formula left as it is"; exit 0; fi
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          mkdir -p Formula
          sh packaging/homebrew/gen-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" > Formula/chatlog.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/chatlog.rb
          if git diff --cached --quiet; then echo "Formula/chatlog.rb already holds $GITHUB_REF_NAME"; exit 0; fi
          git commit -m "formula for ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
