#
# On a tag v*: tarballs for darwin/arm64, darwin/amd64, linux/amd64, linux/arm64 with SHA256SUMS on the GitHub release,
# the container image on ghcr.io, and the Homebrew formula pushed to the tap.
# Secrets: GITHUB_TOKEN (given by Actions) for the release and ghcr.io; TAP_TOKEN, a fine-grained token with contents
# read/write on atvirokodosprendimai/homebrew-chatlog only, for the formula. Without TAP_TOKEN the tap step is skipped.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build the artifacts
        run: sh scripts/release-build.sh "$GITHUB_REF_NAME" dist
      - name: GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/atvirokodosprendimai/chatlog
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # the binaries are cross-built above (no CGO), so the image needs no emulation for arm64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set: tap not updated"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/atvirokodosprendimai/homebrew-chatlog.git" tap
          mkdir -p tap/Formula
          sh packaging/homebrew/gen-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > tap/Formula/chatlog.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/chatlog.rb
          if git diff --cached --quiet; then echo "the tap already holds this formula"; exit 0; fi
          git commit -m "chatlog ${GITHUB_REF_NAME}"
          git push origin HEAD
